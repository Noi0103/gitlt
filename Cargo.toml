[package]
name = "gitlt"
version = "0.1.0"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
ariadne = "0.6.0"
clap = { version = "4.6.7", default-features = false }
